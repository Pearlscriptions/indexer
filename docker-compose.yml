services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pearlscriptions_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-pearlscriptions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional v1.2.1 API/worker split. Enable with:  docker compose --profile app up
  # Bring your own pearld >= v1.1.0 node and set PEARL_RPC_URL/USER/PASSWORD in .env
  # (the MoE hard fork requires pearld >= v1.1.0). The api service serves read-only
  # from shared Postgres state; the worker service is the sole sync writer.
  indexer-worker:
    profiles: ["app"]
    build: .
    command: ["npm", "run", "indexer:worker"]
    env_file: [.env]
    environment:
      PRL20_INDEXER_ROLE: worker
      PRL20_INDEXER_STORAGE_BACKEND: ${PRL20_INDEXER_STORAGE_BACKEND:-postgres}
      PRL20_DATABASE_URL: ${PRL20_DATABASE_URL:-postgres://${POSTGRES_USER:-pearlscriptions}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pearlscriptions_indexer}}
    depends_on:
      postgres:
        condition: service_healthy

  indexer-api:
    profiles: ["app"]
    build: .
    command: ["npm", "run", "indexer:api"]
    env_file: [.env]
    environment:
      PRL20_INDEXER_ROLE: api
      HOST: 0.0.0.0
      PRL20_INDEXER_STORAGE_BACKEND: ${PRL20_INDEXER_STORAGE_BACKEND:-postgres}
      PRL20_DATABASE_URL: ${PRL20_DATABASE_URL:-postgres://${POSTGRES_USER:-pearlscriptions}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pearlscriptions_indexer}}
    ports:
      - "${INDEXER_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
