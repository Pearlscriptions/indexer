name: Bug report
description: Report a reproducible indexer, API, or operator issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Paste the commit hash or release tag you are running.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, route calls, fixture names, and expected versus actual output.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, Postgres version, Pearl node version, operating system, and storage backend.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include wallet seeds, private keys, RPC passwords, database passwords, or API tokens.
          required: true

